<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Argonaut 程序动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { display: block; cursor: none; }

        .ui-panel {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 300px;
            max-height: 88vh;
            overflow-y: auto;
            background: rgba(18, 18, 22, 0.96);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            color: #c8c8c8;
            font-size: 12px;
            backdrop-filter: blur(16px);
            z-index: 100;
            -webkit-overflow-scrolling: touch;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ui-panel.collapsed {
            transform: translateX(calc(100% + 24px));
            opacity: 0;
            pointer-events: none;
        }
        .ui-panel::-webkit-scrollbar { width: 3px; }
        .ui-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: -16px;
            background: rgba(18, 18, 22, 0.96);
            margin: -16px -16px 16px -16px;
            padding: 16px 16px 12px 16px;
            z-index: 10;
        }
        .ui-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ui-toggle-btn {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .ui-toggle-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

        .section-divider {
            margin: 18px 0 14px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 10px;
            color: #555;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .control-group { margin-bottom: 14px; }
        .control-label {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; color: #888; font-size: 11px;
            letter-spacing: 0.3px;
        }
        .control-label span:first-child { flex: 1; }
        .val-display {
            color: #6ec5ff; font-weight: 500; font-family: 'SF Mono', 'Consolas', monospace;
            cursor: pointer; padding: 2px 8px; border-radius: 4px;
            background: rgba(110,197,255,0.06); border: 1px solid rgba(110,197,255,0.12);
            min-width: 48px; text-align: center; transition: all 0.2s;
            user-select: none; font-size: 11px;
        }
        .val-display:hover {
            background: rgba(110,197,255,0.12); border-color: rgba(110,197,255,0.25);
        }
        .val-display.editing {
            background: rgba(110,197,255,0.2); border-color: #6ec5ff;
            outline: none; color: #fff;
        }

        input[type="range"] {
            width: 100%; height: 5px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.06); border-radius: 3px; outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            background: #6ec5ff; border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 6px rgba(110,197,255,0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(110,197,255,0.5);
        }

        .toggle-row {
            display: flex; flex-wrap: wrap; gap: 8px;
            margin-bottom: 14px;
        }
        .toggle-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px; color: #888; font-size: 11px;
            cursor: pointer; transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .toggle-btn:hover { border-color: rgba(255,255,255,0.15); color: #aaa; }
        .toggle-btn.active {
            background: rgba(110,197,255,0.1);
            border-color: rgba(110,197,255,0.3); color: #6ec5ff;
        }
        .toggle-btn::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: #444; transition: background 0.2s;
        }
        .toggle-btn.active::before { background: #6ec5ff; }

        .color-section {
            margin-bottom: 14px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .color-section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .color-section-title {
            font-size: 11px; color: #aaa; letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .color-mode-tabs {
            display: flex; gap: 4px;
        }
        .color-mode-tab {
            flex: 1; padding: 4px 4px; text-align: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 5px; color: #666; font-size: 11px;
            cursor: pointer; transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .color-mode-tab.active {
            background: rgba(110,197,255,0.1);
            border-color: rgba(110,197,255,0.25); color: #6ec5ff;
        }

        .color-map {
            width: 100%; height: 120px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: crosshair;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        .color-map-cursor {
            position: absolute;
            width: 12px; height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .color-preview-bar {
            width: 100%; height: 28px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
            transition: background 0.1s;
            position: relative;
        }
        .color-preview-bar::after {
            content: attr(data-hex);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'SF Mono', monospace;
            font-size: 11px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        .color-inputs { display: flex; flex-direction: column; gap: 6px; }
        .color-input-row {
            display: flex; align-items: center; gap: 8px;
        }
        .color-input-row label {
            width: 18px; font-size: 10px; color: #777; text-align: center;
            font-weight: 600;
        }
        .color-input-row input[type="range"] {
            flex: 1; height: 5px;
        }
        .color-input-row .val-display {
            min-width: 36px; font-size: 10px;
        }

        .ui-expand-btn {
            position: fixed; top: 12px; right: 12px;
            width: 36px; height: 36px;
            background: rgba(18, 18, 22, 0.96);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #888; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 101;
            backdrop-filter: blur(16px);
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0; pointer-events: none;
        }
        .ui-expand-btn.visible { opacity: 1; pointer-events: auto; }
        .ui-expand-btn:hover { color: #fff; border-color: rgba(255,255,255,0.15); }

        .version-tag {
            position: fixed; top: 12px; left: 12px;
            color: rgba(255,255,255,0.18); font-size: 16px;
            font-family: 'SF Mono', monospace; pointer-events: none;
            letter-spacing: 1px;
        }
        .hint {
            position: fixed; bottom: 12px; left: 12px;
            color: rgba(255,255,255,0.2); font-size: 6px; pointer-events: none;
            text-align: left; line-height: 1.6;
        }

        .action-btn:hover{opacity:.85}.action-btn:active{transform:scale(.97)}
        @media (max-width: 600px) {
            .ui-panel { width: 240px; padding: 12px; top: 8px; right: 8px; }
            .ui-header { margin: -12px -12px 16px -12px; padding: 12px 12px 12px 12px; }
            .ui-title { font-size: 12px; }
            .control-label { font-size: 10px; }
            .color-map { height: 90px; }
        }
    
        .fold-section {
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.01);
        }
        .fold-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }
        .fold-header:hover {
            background: rgba(255,255,255,0.06);
        }
        .fold-title {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .fold-arrow {
            font-size: 10px;
            color: #666;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fold-section[data-expanded="false"] .fold-arrow {
            transform: rotate(-90deg);
        }
        .fold-body {
            padding: 10px 12px;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s, padding 0.3s;
            max-height: 2000px;
            opacity: 1;
            overflow: hidden;
        }
        .fold-section[data-expanded="false"] .fold-body {
            max-height: 0;
            opacity: 0;
            padding: 0 12px;
        }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui-panel" id="uiPanel">
    <div class="ui-header">
        <div class="ui-title">Argonaut</div>
        <div class="ui-toggle-btn" id="collapseBtn">✕</div>
    </div>
    <div class="control-group">
        <div class="control-label"><span>跟随速度</span><span class="val-display" id="val-followSpeed" data-param="followSpeed">20</span></div>
        <input type="range" id="followSpeed" min="1" max="200" value="20" step="1">
    </div>

<div class="fold-section" id="fold-skeleton" data-expanded="true">
    <div class="fold-header" onclick="toggleFold('fold-skeleton')">
        <span class="fold-title">骨架</span>
        <span class="fold-arrow">▼</span>
    </div>
    <div class="fold-body">
            <div class="control-group">
        <div class="control-label"><span>节点数</span><span class="val-display" id="val-segments" data-param="segments">24</span></div>
        <input type="range" id="segments" min="2" max="1000" value="24" step="1">
    </div>

    <div class="control-group">
        <div class="control-label"><span>间距</span><span class="val-display" id="val-spacing" data-param="spacing">18</span></div>
        <input type="range" id="spacing" min="0" max="200" value="18" step="1">
    </div>

    <div class="control-group">
        <div class="control-label"><span>角度约束 (°)</span><span class="val-display" id="val-maxAngle" data-param="maxAngle">80</span></div>
        <input type="range" id="maxAngle" min="0" max="90" value="80" step="1">
    </div>

    <div class="control-group">
        <div class="control-label"><span>角度权重衰减</span><span class="val-display" id="val-angleDecay" data-param="angleDecay">0.1</span></div>
        <input type="range" id="angleDecay" min="0.1" max="5" value="0.1" step="0.1">
    </div>
    </div>
</div>
<div class="fold-section" id="fold-body" data-expanded="true">
    <div class="fold-header" onclick="toggleFold('fold-body')">
        <span class="fold-title">体型</span>
        <span class="fold-arrow">▼</span>
    </div>
    <div class="fold-body">
            <div class="control-group">
        <div class="control-label"><span>头部宽度</span><span class="val-display" id="val-headSize" data-param="headSize">14</span></div>
        <input type="range" id="headSize" min="1" max="100" value="14" step="1">
    </div>

    <div class="control-group">
        <div class="control-label"><span>躯体宽度</span><span class="val-display" id="val-bodyWidth" data-param="bodyWidth">14</span></div>
        <input type="range" id="bodyWidth" min="1" max="100" value="14" step="1">
    </div>

    <div class="control-group">
        <div class="control-label"><span>尾部宽度</span><span class="val-display" id="val-tailWidth" data-param="tailWidth">0</span></div>
        <input type="range" id="tailWidth" min="0" max="100" value="0" step="1">
    </div>

    <div class="control-group">
        <div class="control-label"><span>头部占比</span><span class="val-display" id="val-headBlend" data-param="headBlend">0.5</span></div>
        <input type="range" id="headBlend" min="0.0" max="1.0" value="0.5" step="0.01">
    </div>

    <div class="control-group">
        <div class="control-label"><span>尾部占比</span><span class="val-display" id="val-tailBlend" data-param="tailBlend">0.5</span></div>
        <input type="range" id="tailBlend" min="0.0" max="1.0" value="0.5" step="0.01">
    </div>

    <div class="control-group">
        <div class="control-label"><span>尾部衰减</span><span class="val-display" id="val-tailTaper" data-param="tailTaper">0.85</span></div>
        <input type="range" id="tailTaper" min="0.1" max="1.0" value="0.85" step="0.01">
    </div>
    </div>
</div>
<div class="fold-section" id="fold-color" data-expanded="true">
    <div class="fold-header" onclick="toggleFold('fold-color')">
        <span class="fold-title">颜色</span>
        <span class="fold-arrow">▼</span>
    </div>
    <div class="fold-body">
            <div class="color-section">
        <div class="color-section-header">
            <div class="color-section-title">颜色</div>
            <div class="color-mode-tabs">
                <div class="color-mode-tab active" data-mode="rgb">RGB</div>
                <div class="color-mode-tab" data-mode="hsv">HSV</div>
            </div>
        </div>
        <div class="color-map" id="colorMap">
            <div class="color-map-cursor" id="colorMapCursor"></div>
        </div>
        <div class="color-preview-bar" id="colorPreview" data-hex="#6EC5FF"></div>
        <div class="color-inputs" id="colorInputs"></div>
    </div>
    </div>
</div>

    <div class="section-divider">显示</div>
<div class="fold-section" id="fold-display" data-expanded="true">
    <div class="fold-header" onclick="toggleFold('fold-display')">
        <span class="fold-title">显示</span>
        <span class="fold-arrow">▼</span>
    </div>
    <div class="fold-body">
            <div class="toggle-row">
        <div class="toggle-btn active" id="showGrid">网格</div>
        <div class="toggle-btn active" id="showTether">牵引</div>
        <div class="toggle-btn" id="showBones">骨骼</div>
    </div>
    </div>
</div>

    <div class="section-divider">操作</div>
<div class="fold-section" id="fold-action" data-expanded="true">
    <div class="fold-header" onclick="toggleFold('fold-action')">
        <span class="fold-title">操作</span>
        <span class="fold-arrow">▼</span>
    </div>
    <div class="fold-body">
            <div class="action-row" style="display: flex; gap: 8px; margin-bottom: 14px;">
        <button class="action-btn" id="saveBtn" style="flex: 1; padding: 8px 0; background: rgba(110,197,255,0.1); border: 1px solid rgba(110,197,255,0.25); border-radius: 6px; color: #6ec5ff; font-size: 12px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s;">保存</button>
        <button class="action-btn" id="resetBtn" style="flex: 1; padding: 8px 0; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); border-radius: 6px; color: #ff6464; font-size: 12px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s;">重置</button>
    </div>
    </div>
</div>
</div>

</div>

<div class="ui-expand-btn" id="expandBtn">☰</div>

<div class="version-tag">Maker: xsj</div>
<div class="hint">左键/单指: 控制方向<br>中键/双指: 平移画布<br>滚轮/捏合: 缩放</div>

<script>
// ==================== 核心参数 ====================
const params = {
    segments: 24,
    spacing: 18,
    maxAngle: 90 * Math.PI / 180,
    angleDecay: 0.1,
    followSpeed: 100,
    headSize: 14,
    bodyWidth: 14,
    headBlend: 0.5,
    tailWidth: 0,
    tailTaper: 0.85,
    tailBlend: 0.5,
    color: '#6ec5ff',
    showBones: false,
    showGrid: true,
    showTether: true,
    maxSpeed: 200
};

// ==================== Canvas 与视口 ====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let view = { x: 0, y: 0, zoom: 1 };

// ==================== 蛇的数据结构 ====================
let nodes = [];
let target = { x: 0, y: 0 };
let isMoving = false;

function initSnake() {
    nodes = [];
    const startX = view.x;
    const startY = view.y;
    for (let i = 0; i < params.segments; i++) {
        nodes.push({ x: startX - i * params.spacing, y: startY });
    }
}
initSnake();

try{const d=JSON.parse(localStorage.getItem('argonaut_params')||'{}');Object.assign(params,d)}catch(e){}

// ==================== 坐标转换 ====================
function worldToScreen(wx, wy) {
    return {
        x: (wx - view.x) * view.zoom + W / 2,
        y: (wy - view.y) * view.zoom + H / 2
    };
}
function screenToWorld(sx, sy) {
    return {
        x: (sx - W / 2) / view.zoom + view.x,
        y: (sy - H / 2) / view.zoom + view.y
    };
}

// ==================== 数学工具 ====================
function dist(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    return Math.sqrt(dx*dx + dy*dy);
}
function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}
function smoothstep(t) {
    return t * t * (3 - 2 * t);
}
function lerp(a, b, t) {
    return a + (b - a) * t;
}

// ==================== 一、距离约束 ====================
function applyDistanceConstraint(leader, follower, desiredDist) {
    const dx = follower.x - leader.x;
    const dy = follower.y - leader.y;
    const currentDist = Math.sqrt(dx*dx + dy*dy);
    if (currentDist < 0.001) return;
    const scale = desiredDist / currentDist;
    follower.x = leader.x + dx * scale;
    follower.y = leader.y + dy * scale;
}

// ==================== 二、串联约束 ====================
function applyChainConstraints() {
    for (let i = 1; i < nodes.length; i++) {
        applyDistanceConstraint(nodes[i-1], nodes[i], params.spacing);
    }
}

// ==================== 三、角度约束 + 四、权重衰减 ====================
function applyAngleConstraints() {
    const total = nodes.length - 1;
    for (let i = 1; i < total; i++) {
        const t = i / total;
        const weight = Math.pow(1 - t, params.angleDecay) * 0.85 + 0.15;
        const effectiveMaxAngle = params.maxAngle * weight;

        const angle1 = Math.atan2(nodes[i].y - nodes[i-1].y, nodes[i].x - nodes[i-1].x);
        const angle2 = Math.atan2(nodes[i+1].y - nodes[i].y, nodes[i+1].x - nodes[i].x);
        let diff = normalizeAngle(angle2 - angle1);

        if (Math.abs(diff) > effectiveMaxAngle) {
            const clampedDiff = Math.sign(diff) * effectiveMaxAngle;
            const newAngle = angle1 + clampedDiff;
            nodes[i+1].x = nodes[i].x + Math.cos(newAngle) * params.spacing;
            nodes[i+1].y = nodes[i].y + Math.sin(newAngle) * params.spacing;
        }
    }
}

// ==================== 五、平滑体型生成 ====================
function getSegmentRadius(i) {
    const total = nodes.length;
    if (total <= 1) return params.headSize;
    if (i === 0) return params.headSize;

    const headEnd = total * params.headBlend;
    const tailStart = total * (1 - params.tailBlend);

    if (i <= headEnd) {
        if (headEnd <= 0.5) return params.bodyWidth;
        const t = i / headEnd;
        const ease = smoothstep(t);
        return lerp(params.headSize, params.bodyWidth, ease);
    } else if (i >= tailStart) {
        const tailLen = total - tailStart;
        if (tailLen <= 0.5) return params.bodyWidth;
        const tailProgress = (i - tailStart) / tailLen;
        const eased = smoothstep(tailProgress);
        return lerp(params.bodyWidth, params.tailWidth, eased * params.tailTaper);
    } else {
        return params.bodyWidth;
    }
}

function getOutlinePoints() {
    const leftPoints = [], rightPoints = [];
    for (let i = 0; i < nodes.length; i++) {
        let angle;
        if (i === 0) {
            angle = Math.atan2(nodes[1].y - nodes[0].y, nodes[1].x - nodes[0].x);
        } else if (i === nodes.length - 1) {
            angle = Math.atan2(nodes[i].y - nodes[i-1].y, nodes[i].x - nodes[i-1].x);
        } else {
            const a1 = Math.atan2(nodes[i].y - nodes[i-1].y, nodes[i].x - nodes[i-1].x);
            const a2 = Math.atan2(nodes[i+1].y - nodes[i].y, nodes[i+1].x - nodes[i].x);
            let avg = (a1 + a2) / 2;
            if (Math.abs(a1 - a2) > Math.PI) avg += Math.PI;
            angle = normalizeAngle(avg);
        }
        const radius = getSegmentRadius(i);
        const leftAngle = angle + Math.PI / 2;
        const rightAngle = angle - Math.PI / 2;
        leftPoints.push({ x: nodes[i].x + Math.cos(leftAngle) * radius, y: nodes[i].y + Math.sin(leftAngle) * radius });
        rightPoints.push({ x: nodes[i].x + Math.cos(rightAngle) * radius, y: nodes[i].y + Math.sin(rightAngle) * radius });
    }
    return { left: leftPoints, right: rightPoints };
}

// ==================== 六、平滑轮廓连接 (v2.0 正确版本) ====================
function drawSmoothOutline(left, right) {
    ctx.beginPath();

    // 右侧轮廓：从尾到头，用二次贝塞尔曲线（中点作为控制点）
    const lastR = right[right.length - 1];
    const r0 = worldToScreen(lastR.x, lastR.y);
    ctx.moveTo(r0.x, r0.y);
    for (let i = right.length - 2; i >= 0; i--) {
        const cp = worldToScreen((right[i].x + right[i+1].x) / 2, (right[i].y + right[i+1].y) / 2);
        const p = worldToScreen(right[i+1].x, right[i+1].y);
        ctx.quadraticCurveTo(p.x, p.y, cp.x, cp.y);
    }

    // 头部圆弧
    const headAngle = Math.atan2(nodes[1].y - nodes[0].y, nodes[1].x - nodes[0].x);
    const h = worldToScreen(nodes[0].x, nodes[0].y);
    const rHead = params.headSize * view.zoom;
    ctx.arc(h.x, h.y, rHead, headAngle - Math.PI/2, headAngle + Math.PI/2, true);

    // 左侧轮廓：从头到尾，用二次贝塞尔曲线（中点作为控制点）
    for (let i = 0; i < left.length - 1; i++) {
        const cp = worldToScreen((left[i].x + left[i+1].x) / 2, (left[i].y + left[i+1].y) / 2);
        const p = worldToScreen(left[i].x, left[i].y);
        ctx.quadraticCurveTo(p.x, p.y, cp.x, cp.y);
    }

    // 尾部闭合
    const lastL = left[left.length - 1];
    const l0 = worldToScreen(lastL.x, lastL.y);
    ctx.lineTo(l0.x, l0.y);
    ctx.closePath();

    ctx.fillStyle = params.color;
    ctx.globalAlpha = 0.92;
    ctx.fill();
    ctx.strokeStyle = params.color;
    ctx.globalAlpha = 0.2;
    ctx.lineWidth = 1 * view.zoom;
    ctx.stroke();
    ctx.globalAlpha = 1;
}

// ==================== 七、头部特殊处理 ====================
function drawHead() {
    const head = nodes[0];
    const dir = Math.atan2(nodes[1].y - nodes[0].y, nodes[1].x - nodes[0].x);
    const h = worldToScreen(head.x, head.y);
    const eyeOffset = params.headSize * 0.42 * view.zoom;
    const eyeRadius = params.headSize * 0.2 * view.zoom;

    const leftEyeAngle = dir + Math.PI / 2;
    const rightEyeAngle = dir - Math.PI / 2;
    const leftEyeX = h.x + Math.cos(leftEyeAngle) * eyeOffset;
    const leftEyeY = h.y + Math.sin(leftEyeAngle) * eyeOffset;
    const rightEyeX = h.x + Math.cos(rightEyeAngle) * eyeOffset;
    const rightEyeY = h.y + Math.sin(rightEyeAngle) * eyeOffset;

    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(255,255,255,0.4)';
    ctx.shadowBlur = 5 * view.zoom;
    ctx.beginPath();
    ctx.arc(leftEyeX, leftEyeY, eyeRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(rightEyeX, rightEyeY, eyeRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

// ==================== 骨骼显示 ====================
function drawBones() {
    if (!params.showBones) return;

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const s0 = worldToScreen(nodes[0].x, nodes[0].y);
    ctx.moveTo(s0.x, s0.y);
    for (let i = 1; i < nodes.length; i++) {
        const s = worldToScreen(nodes[i].x, nodes[i].y);
        ctx.lineTo(s.x, s.y);
    }
    ctx.stroke();

    for (let i = 0; i < nodes.length; i++) {
        const s = worldToScreen(nodes[i].x, nodes[i].y);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, (i === 0 ? 4 : 2) * view.zoom, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ==================== LOD 自适应无限背景网格 ====================
function drawInfiniteGrid() {
    if (!params.showGrid) return;

    const lodLevels = [2.5, 5, 10, 20, 40, 80, 160, 320, 640, 1280, 2560, 5120];
    const targetMin = 30;
    const targetMax = 80;

    let primaryLOD = lodLevels[4];
    for (let i = 0; i < lodLevels.length; i++) {
        const screenSize = lodLevels[i] * view.zoom;
        if (screenSize >= targetMin && screenSize <= targetMax) {
            primaryLOD = lodLevels[i];
            break;
        }
        if (screenSize > targetMax && i > 0) {
            const prevSize = lodLevels[i-1] * view.zoom;
            if (prevSize >= targetMin) {
                primaryLOD = lodLevels[i-1];
            } else {
                primaryLOD = lodLevels[i];
            }
            break;
        }
        if (i === lodLevels.length - 1) {
            primaryLOD = lodLevels[i];
        }
    }

    const secondaryLOD = primaryLOD * 4;
    drawGridLayer(secondaryLOD, 'rgba(255,255,255,0.015)', 1);
    drawGridLayer(primaryLOD, 'rgba(255,255,255,0.035)', 1);

    const fineLOD = primaryLOD / 4;
    if (fineLOD >= lodLevels[0]) {
        const fineScreenSize = fineLOD * view.zoom;
        if (fineScreenSize >= 20) {
            drawGridLayer(fineLOD, 'rgba(255,255,255,0.018)', 0.5);
        }
    }

    const origin = worldToScreen(0, 0);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(origin.x, 0); ctx.lineTo(origin.x, H);
    ctx.moveTo(0, origin.y); ctx.lineTo(W, origin.y);
    ctx.stroke();
}

function drawGridLayer(gridSizeWorld, color, lineWidth) {
    const gridSize = gridSizeWorld * view.zoom;
    const offsetX = ((-view.x * view.zoom + W/2) % gridSize + gridSize) % gridSize;
    const offsetY = ((-view.y * view.zoom + H/2) % gridSize + gridSize) % gridSize;

    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;

    for (let x = offsetX - gridSize; x < W + gridSize; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
    for (let y = offsetY - gridSize; y < H + gridSize; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
}

// ==================== 目标点指示 ====================
function drawTether() {
    if (!params.showTether || !isMoving || panning || pinching) return;

    const h = worldToScreen(nodes[0].x, nodes[0].y);
    const t = worldToScreen(target.x, target.y);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(h.x, h.y);
    ctx.lineTo(t.x, t.y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 4 * view.zoom, 0, Math.PI * 2);
    ctx.fill();
}

// ==================== 交互控制 ====================
let panning = false;
let panStart = { x: 0, y: 0 };
let viewStart = { x: 0, y: 0 };
let pinching = false;

let isMouseDown = false;

canvas.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    if (e.button === 1 || (e.button === 0 && e.shiftKey)) {
        panning = true;
        panStart = { x: e.clientX, y: e.clientY };
        viewStart = { x: view.x, y: view.y };
    } else if (e.button === 0) {
        isMoving = true;
        const w = screenToWorld(e.clientX, e.clientY);
        target.x = w.x; target.y = w.y;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (panning) {
        const dx = (e.clientX - panStart.x) / view.zoom;
        const dy = (e.clientY - panStart.y) / view.zoom;
        view.x = viewStart.x - dx;
        view.y = viewStart.y - dy;
    } else if (isMoving && isMouseDown) {
        const w = screenToWorld(e.clientX, e.clientY);
        target.x = w.x; target.y = w.y;
    }
});

canvas.addEventListener('mouseup', () => { isMouseDown = false; isMoving = false; panning = false; });
canvas.addEventListener('mouseleave', () => { isMouseDown = false; isMoving = false; panning = false; });

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    const mouseWorld = screenToWorld(e.clientX, e.clientY);
    view.zoom = Math.max(0.01, Math.min(100, view.zoom * zoomFactor));
    const newScreen = worldToScreen(mouseWorld.x, mouseWorld.y);
    view.x += (e.clientX - newScreen.x) / view.zoom;
    view.y += (e.clientY - newScreen.y) / view.zoom;
}, { passive: false });

let touchStartDist = 0;
let touchStartZoom = 1;
let touchPanStart = { x: 0, y: 0 };
let touchViewStart = { x: 0, y: 0 };

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
        pinching = true;
        isMoving = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.sqrt(dx*dx + dy*dy);
        touchStartZoom = view.zoom;
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        touchPanStart = { x: cx, y: cy };
        touchViewStart = { x: view.x, y: view.y };
    } else if (e.touches.length === 1) {
        isMoving = true;
        pinching = false;
        const touch = e.touches[0];
        const w = screenToWorld(touch.clientX, touch.clientY);
        target.x = w.x; target.y = w.y;
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (pinching && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const zoomFactor = dist / touchStartDist;
        view.zoom = Math.max(0.01, Math.min(100, touchStartZoom * zoomFactor));

        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const dvx = (cx - touchPanStart.x) / view.zoom;
        const dvy = (cy - touchPanStart.y) / view.zoom;
        view.x = touchViewStart.x - dvx;
        view.y = touchViewStart.y - dvy;
    } else if (isMoving && e.touches.length === 1) {
        const touch = e.touches[0];
        const w = screenToWorld(touch.clientX, touch.clientY);
        target.x = w.x; target.y = w.y;
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.touches.length < 2) pinching = false;
    if (e.touches.length === 0) isMoving = false;
});

// ==================== 颜色工具 ====================
function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return { r, g, b };
}
function rgbToHex(r, g, b) {
    return '#' + [r,g,b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2,'0')).join('');
}
function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    const d = max - min;
    let h = 0, s = max === 0 ? 0 : d / max, v = max;
    if (d !== 0) {
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (max === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
    }
    return { h: h * 360, s: s * 100, v: v * 100 };
}
function hsvToRgb(h, s, v) {
    h = ((h % 360) + 360) % 360;
    s = Math.max(0, Math.min(100, s)) / 100;
    v = Math.max(0, Math.min(100, v)) / 100;
    let r, g, b;
    const i = Math.floor(h / 60);
    const f = h / 60 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        case 5: r = v; g = p; b = q; break;
    }
    return { r: r * 255, g: g * 255, b: b * 255 };
}

let colorState = { mode: 'rgb', ...hexToRgb(params.color), ...rgbToHsv(...Object.values(hexToRgb(params.color))) };

// ==================== 色域图绘制 ====================
function drawColorMap() {
    const mapEl = document.getElementById('colorMap');
    const mapCanvas = document.createElement('canvas');
    mapCanvas.width = mapEl.offsetWidth * 2;
    mapCanvas.height = mapEl.offsetHeight * 2;
    const mctx = mapCanvas.getContext('2d');

    const w = mapCanvas.width, h = mapCanvas.height;
    const imgData = mctx.createImageData(w, h);
    const data = imgData.data;

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const s = (x / w) * 100;
            const v = 100 - (y / h) * 100;
            const rgb = hsvToRgb(colorState.h, s, v);
            const idx = (y * w + x) * 4;
            data[idx] = rgb.r;
            data[idx+1] = rgb.g;
            data[idx+2] = rgb.b;
            data[idx+3] = 255;
        }
    }
    mctx.putImageData(imgData, 0, 0);

    mapEl.style.backgroundImage = `url(${mapCanvas.toDataURL()})`;
    mapEl.style.backgroundSize = '100% 100%';
}

function updateColorMapCursor() {
    const mapEl = document.getElementById('colorMap');
    const cursor = document.getElementById('colorMapCursor');
    const x = (colorState.s / 100) * mapEl.offsetWidth;
    const y = (1 - colorState.v / 100) * mapEl.offsetHeight;
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';
}

// ==================== UI 绑定 ====================

function toggleFold(id) {
    const section = document.getElementById(id);
    if (!section) return;
    const isExpanded = section.getAttribute('data-expanded') === 'true';
    section.setAttribute('data-expanded', String(!isExpanded));
}

function bindUI() {
    const panel = document.getElementById('uiPanel');
    const collapseBtn = document.getElementById('collapseBtn');
    const expandBtn = document.getElementById('expandBtn');
    collapseBtn.addEventListener('click', () => {
        panel.classList.add('collapsed');
        expandBtn.classList.add('visible');
    });
    expandBtn.addEventListener('click', () => {
        panel.classList.remove('collapsed');
        expandBtn.classList.remove('visible');
    });

    const sliderDefs = [
        { id: 'segments', valId: 'val-segments', parser: v => parseInt(v), min: 2, max: 1000 },
        { id: 'spacing', valId: 'val-spacing', parser: v => parseInt(v), min: 0, max: 200 },
        { id: 'maxAngle', valId: 'val-maxAngle', parser: v => parseInt(v) * Math.PI / 180, min: 0, max: 180 },
        { id: 'angleDecay', valId: 'val-angleDecay', parser: v => parseFloat(v), min: 0.1, max: 5.0 },
        { id: 'headSize', valId: 'val-headSize', parser: v => parseInt(v), min: 1, max: 100 },
        { id: 'headBlend', valId: 'val-headBlend', parser: v => parseFloat(v), min: 0.0, max: 1.0 },
        { id: 'bodyWidth', valId: 'val-bodyWidth', parser: v => parseInt(v), min: 1, max: 100 },
        { id: 'tailWidth', valId: 'val-tailWidth', parser: v => parseInt(v), min: 0, max: 100 },
        { id: 'tailBlend', valId: 'val-tailBlend', parser: v => parseFloat(v), min: 0.0, max: 1.0 },
        { id: 'tailTaper', valId: 'val-tailTaper', parser: v => parseFloat(v), min: 0.1, max: 1.0 },
        { id: 'followSpeed', valId: 'val-followSpeed', parser: v => parseInt(v), min: 1, max: 100 }
    ];

    sliderDefs.forEach(def => {
        const el = document.getElementById(def.id);
        const valEl = document.getElementById(def.valId);

        el.addEventListener('input', () => {
            params[def.id] = def.parser(el.value);
            valEl.textContent = el.value;
            if (def.id === 'segments') {
                const diff = params.segments - nodes.length;
                if (diff > 0) {
                    const last = nodes[nodes.length - 1];
                    for (let i = 0; i < diff; i++) nodes.push({ x: last.x, y: last.y });
                } else if (diff < 0) nodes.splice(params.segments);
            }
        });

        valEl.addEventListener('click', () => {
            if (valEl.isEditing) return;
            valEl.isEditing = true;
            valEl.contentEditable = true;
            valEl.classList.add('editing');
            valEl.focus();
            const range = document.createRange();
            range.selectNodeContents(valEl);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        });

        valEl.addEventListener('blur', () => finishEdit(valEl, def));
        valEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); finishEdit(valEl, def); }
            if (e.key === 'Escape') { valEl.textContent = el.value; finishEdit(valEl, def); }
        });
    });

    function finishEdit(valEl, def) {
        valEl.isEditing = false;
        valEl.contentEditable = false;
        valEl.classList.remove('editing');
        let val = parseFloat(valEl.textContent);
        if (isNaN(val)) { valEl.textContent = document.getElementById(def.id).value; return; }
        val = Math.max(def.min, Math.min(def.max, val));
        document.getElementById(def.id).value = val;
        params[def.id] = def.parser(val);
        valEl.textContent = val;
        if (def.id === 'segments') {
            const diff = params.segments - nodes.length;
            if (diff > 0) {
                const last = nodes[nodes.length - 1];
                for (let i = 0; i < diff; i++) nodes.push({ x: last.x, y: last.y });
            } else if (diff < 0) nodes.splice(params.segments);
        }
    }

    const colorInputs = document.getElementById('colorInputs');
    const colorPreview = document.getElementById('colorPreview');
    const modeTabs = document.querySelectorAll('.color-mode-tab');
    const colorMap = document.getElementById('colorMap');

    function updateColorPreview() {
        colorPreview.style.background = params.color;
        colorPreview.setAttribute('data-hex', params.color.toUpperCase());
    }

    function updateColorFromRGB() {
        params.color = rgbToHex(colorState.r, colorState.g, colorState.b);
        const hsv = rgbToHsv(colorState.r, colorState.g, colorState.b);
        Object.assign(colorState, hsv);
        updateColorPreview();
        drawColorMap();
        updateColorMapCursor();
        updateColorInputs();
    }

    function updateColorFromHSV() {
        const rgb = hsvToRgb(colorState.h, colorState.s, colorState.v);
        Object.assign(colorState, rgb);
        params.color = rgbToHex(rgb.r, rgb.g, rgb.b);
        updateColorPreview();
        drawColorMap();
        updateColorMapCursor();
        updateColorInputs();
    }

        function updateColorInputs() {
        const rows = colorInputs.querySelectorAll('.color-input-row');
        if (colorState.mode === 'rgb') {
            const keys = ['r', 'g', 'b'];
            rows.forEach((row, i) => {
                if (i < keys.length) {
                    const key = keys[i];
                    const slider = row.querySelector('input[type="range"]');
                    const valDisplay = row.querySelector('.val-display');
                    if (slider && valDisplay && !valDisplay.isEditing) {
                        slider.value = Math.round(colorState[key]);
                        valDisplay.textContent = Math.round(colorState[key]);
                    }
                }
            });
        } else {
            const keys = ['h', 's', 'v'];
            rows.forEach((row, i) => {
                if (i < keys.length) {
                    const key = keys[i];
                    const slider = row.querySelector('input[type="range"]');
                    const valDisplay = row.querySelector('.val-display');
                    if (slider && valDisplay && !valDisplay.isEditing) {
                        slider.value = Math.round(colorState[key]);
                        valDisplay.textContent = Math.round(colorState[key]);
                    }
                }
            });
        }
    }

function buildColorInputs() {
        colorInputs.innerHTML = '';
        if (colorState.mode === 'rgb') {
            ['R','G','B'].forEach((label) => {
                const key = label.toLowerCase();
                const row = document.createElement('div');
                row.className = 'color-input-row';
                row.innerHTML = `<label>${label}</label>
                    <input type="range" min="0" max="255" value="${Math.round(colorState[key])}">
                    <span class="val-display">${Math.round(colorState[key])}</span>`;
                const slider = row.querySelector('input');
                const valDisplay = row.querySelector('.val-display');

                slider.addEventListener('input', () => {
                    colorState[key] = parseInt(slider.value);
                    valDisplay.textContent = slider.value;
                    updateColorFromRGB();
                });

                valDisplay.addEventListener('click', () => {
                    if (valDisplay.isEditing) return;
                    valDisplay.isEditing = true;
                    valDisplay.contentEditable = true;
                    valDisplay.classList.add('editing');
                    valDisplay.focus();
                    const range = document.createRange();
                    range.selectNodeContents(valDisplay);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                });

                valDisplay.addEventListener('blur', () => {
                    valDisplay.isEditing = false;
                    valDisplay.contentEditable = false;
                    valDisplay.classList.remove('editing');
                    let val = parseInt(valDisplay.textContent);
                    if (isNaN(val)) { valDisplay.textContent = slider.value; return; }
                    val = Math.max(0, Math.min(255, val));
                    colorState[key] = val;
                    slider.value = val;
                    valDisplay.textContent = val;
                    updateColorFromRGB();
                });
                valDisplay.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); valDisplay.blur(); }
                    if (e.key === 'Escape') { valDisplay.textContent = slider.value; valDisplay.blur(); }
                });

                colorInputs.appendChild(row);
            });
        } else {
            const defs = [
                { label: 'H', key: 'h', min: 0, max: 360 },
                { label: 'S', key: 's', min: 0, max: 100 },
                { label: 'V', key: 'v', min: 0, max: 100 }
            ];
            defs.forEach(d => {
                const row = document.createElement('div');
                row.className = 'color-input-row';
                row.innerHTML = `<label>${d.label}</label>
                    <input type="range" min="${d.min}" max="${d.max}" value="${Math.round(colorState[d.key])}">
                    <span class="val-display">${Math.round(colorState[d.key])}</span>`;
                const slider = row.querySelector('input');
                const valDisplay = row.querySelector('.val-display');

                slider.addEventListener('input', () => {
                    colorState[d.key] = parseInt(slider.value);
                    valDisplay.textContent = slider.value;
                    updateColorFromHSV();
                });

                valDisplay.addEventListener('click', () => {
                    if (valDisplay.isEditing) return;
                    valDisplay.isEditing = true;
                    valDisplay.contentEditable = true;
                    valDisplay.classList.add('editing');
                    valDisplay.focus();
                    const range = document.createRange();
                    range.selectNodeContents(valDisplay);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                });

                valDisplay.addEventListener('blur', () => {
                    valDisplay.isEditing = false;
                    valDisplay.contentEditable = false;
                    valDisplay.classList.remove('editing');
                    let val = parseInt(valDisplay.textContent);
                    if (isNaN(val)) { valDisplay.textContent = slider.value; return; }
                    val = Math.max(d.min, Math.min(d.max, val));
                    colorState[d.key] = val;
                    slider.value = val;
                    valDisplay.textContent = val;
                    updateColorFromHSV();
                });
                valDisplay.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); valDisplay.blur(); }
                    if (e.key === 'Escape') { valDisplay.textContent = slider.value; valDisplay.blur(); }
                });

                colorInputs.appendChild(row);
            });
        }
    }

    let isDraggingColorMap = false;
    colorMap.addEventListener('mousedown', (e) => {
        isDraggingColorMap = true;
        updateColorFromMap(e);
    });
    colorMap.addEventListener('mousemove', (e) => {
        if (isDraggingColorMap) updateColorFromMap(e);
    });
    colorMap.addEventListener('mouseup', () => isDraggingColorMap = false);
    colorMap.addEventListener('mouseleave', () => isDraggingColorMap = false);

    colorMap.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isDraggingColorMap = true;
        updateColorFromMap(e.touches[0]);
    }, { passive: false });
    colorMap.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (isDraggingColorMap) updateColorFromMap(e.touches[0]);
    }, { passive: false });
    colorMap.addEventListener('touchend', () => isDraggingColorMap = false);

    function updateColorFromMap(e) {
        const rect = colorMap.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        colorState.s = x * 100;
        colorState.v = 100 - y * 100;
        const rgb = hsvToRgb(colorState.h, colorState.s, colorState.v);
        Object.assign(colorState, rgb);
        params.color = rgbToHex(rgb.r, rgb.g, rgb.b);
        updateColorPreview();
        drawColorMap();
        updateColorMapCursor();
        buildColorInputs();
    }

    modeTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            modeTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            colorState.mode = tab.dataset.mode;
            buildColorInputs();
        });
    });

    buildColorInputs();
    updateColorPreview();
    drawColorMap();
    updateColorMapCursor();

    document.getElementById('showBones').addEventListener('click', function() {
        params.showBones = !params.showBones;
        this.classList.toggle('active');
    });
    document.getElementById('showGrid').addEventListener('click', function() {
        params.showGrid = !params.showGrid;
        this.classList.toggle('active');
    });
    document.getElementById('showTether').addEventListener('click', function() {
        params.showTether = !params.showTether;
        this.classList.toggle('active');
    });

    document.getElementById('saveBtn').addEventListener('click',function(){
        const keys=['segments','spacing','maxAngle','angleDecay','followSpeed','headSize','bodyWidth','headBlend','tailWidth','tailTaper','tailBlend','color','showBones','showGrid','showTether'];
        const saveData={};for(const k of keys)saveData[k]=params[k];
        localStorage.setItem('argonaut_params',JSON.stringify(saveData));
        this.textContent='已保存';setTimeout(()=>this.textContent='保存',1200);
    });

    document.getElementById('resetBtn').addEventListener('click',function(){
        const defs={segments:24,spacing:18,maxAngle:Math.PI/2,angleDecay:.1,followSpeed:100,headSize:14,bodyWidth:14,headBlend:.5,tailWidth:0,tailTaper:.85,tailBlend:.5,color:'#6ec5ff',showBones:0,showGrid:1,showTether:1};
        Object.assign(params,defs);
        sliderDefs.forEach(d=>{const s=document.getElementById(d.id),v=document.getElementById(d.valId);let x=defs[d.id];if(d.id==='maxAngle')x=Math.round(x*180/Math.PI);s.value=x;v.textContent=x;});
        const diff=params.segments-nodes.length;if(diff>0){const last=nodes[nodes.length-1];for(let i=0;i<diff;i++)nodes.push({x:last.x,y:last.y});}else if(diff<0)nodes.splice(params.segments);
        colorState={mode:'rgb',...hexToRgb(params.color),...rgbToHsv(...Object.values(hexToRgb(params.color)))};
        updateColorPreview();drawColorMap();updateColorMapCursor();buildColorInputs();
        document.getElementById('showGrid').classList.toggle('active',params.showGrid);
        document.getElementById('showTether').classList.toggle('active',params.showTether);
        document.getElementById('showBones').classList.toggle('active',params.showBones);
        this.textContent='已重置';setTimeout(()=>this.textContent='重置',1200);
    });
}

bindUI();

// ==================== 主循环 ====================
function update() {
    if (isMoving && !panning && !pinching) {
        const dx = target.x - nodes[0].x;
        const dy = target.y - nodes[0].y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        if (distance > 1) {
            const angle = Math.atan2(dy, dx);
            const screenDistance = distance * view.zoom;
            const screenSpeed = Math.min(screenDistance * (params.followSpeed / 100), params.maxSpeed * view.zoom);
            const worldSpeed = screenSpeed / view.zoom;
            nodes[0].x += Math.cos(angle) * worldSpeed;
            nodes[0].y += Math.sin(angle) * worldSpeed;
        }
    }
    applyChainConstraints();
    applyAngleConstraints();
    for (let iter = 0; iter < 3; iter++) {
        applyChainConstraints();
        applyAngleConstraints();
    }
}

function draw() {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    drawInfiniteGrid();

    const outline = getOutlinePoints();
    drawSmoothOutline(outline.left, outline.right);
    drawHead();
    drawBones();
    drawTether();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
